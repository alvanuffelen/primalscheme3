downsample_always_add_prop = 0.25

# Amplicon Settings
amplicon_size = 800
amplicon_size_min = 0
amplicon_size_max = 0

# Primer Settings
_primer_size_default_min = 18
_primer_size_default_max = 25
_primer_size_hgc_min = 17
_primer_size_hgc_max = 30
_primer_gc_default_min = 40
_primer_gc_default_max = 60
_primer_gc_hgc_min = 40
_primer_gc_hgc_max = 65
primer_annealing_prop = ""
use_annealing = false

# Thermo
use_matchdb = true
in_memory_db = true
primer_tm_min = 60
primer_tm_max = 64
primer_annealing_tempc = 65
_primer_annealing_prop_default = 20
primer_hairpin_dg_max = -3
primer_homopolymer_max = 5
primer_max_walk = 80
mismatch_fuzzy = true
mismatch_product_size = 0

# Thermodynamic Parameters
mv_conc = 100.0
dv_conc = 2.0
dntp_conc = 0.8
dna_conc = 15.0
dimer_score = -9
